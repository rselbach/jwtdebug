# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: jwtdebug
    main: ./cmd/jwtdebug
    binary: jwtdebug
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/rselbach/jwtdebug/internal/jwtdebug.version={{ .Version }}
        -X github.com/rselbach/jwtdebug/internal/jwtdebug.commit={{ .ShortCommit }}
        -X github.com/rselbach/jwtdebug/internal/jwtdebug.buildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

homebrew_casks:
  - binaries:
      - jwtdebug
    homepage: https://github.com/rselbach/jwtdebug
    license: MIT
    description: >-
      A command line tool to decode and debug JWTs (JSON Web Tokens).
    repository:
      owner: rselbach
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

archives:
  - id: default
    ids:
      - jwtdebug
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: jwtdebug
    package_name: jwtdebug
    homepage: https://github.com/rselbach/jwtdebug
    maintainer: Roberto Selbach <r@selbach.dev>
    license: MIT
    description: >-
      A command line tool to decode and debug JWTs (JSON Web Tokens).
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
  replace_existing_draft: true
  mode: replace
