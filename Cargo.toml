[package]
name = "jwtdebug"
version = "1.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "A fast command-line utility for decoding and debugging JSON Web Tokens"
repository = "https://github.com/rselbach/jwtdebug"
exclude = ["/build"]

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pem"] }
p384 = { version = "0.13.1", features = ["ecdsa", "pem"] }
p521 = { version = "0.14.0", features = ["ecdsa", "pem"] }
pkcs8 = "0.10.2"
regex = "1.12.2"
rsa = { version = "0.9.8", features = ["sha2"] }
sec1 = "0.7.3"
serde = "1.0.229"
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
signature = "2.2.0"
spki = "0.7.3"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
x509-cert = "0.2.5"

[dev-dependencies]
rand = "0.8.5"
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"
