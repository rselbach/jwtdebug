[package]
name = "jwtdebug"
version = "1.3.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A fast, modern command-line utility for decoding and debugging JSON Web Tokens."
repository = "https://github.com/rselbach/jwtdebug"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.5.51", features = ["derive"] }
jsonwebtoken = "11.0.0"
# jsonwebtoken has no ES512 support, so P-521 verification uses RustCrypto.
p521 = "0.14.0"
regex = "1.12.2"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
